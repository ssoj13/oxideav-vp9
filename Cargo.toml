[package]
name = "oxideav-vp9"
version = "0.0.13"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-vp9"
authors = ["Mark Karpeles"]
description = "Pure-Rust VP9 codec — orphan-rebuild scaffold pending clean-room re-implementation."

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-vp9"
keywords = ["multimedia", "video", "vp9", "codec", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::video"]

[dependencies]
# ffmpeg-rs fork: core from our fork so every consumer of ffmpeg-rs resolves the same oxideav-core (no [patch] needed).
oxideav-core = { git = "ssh://git@github.com/ssoj13/oxideav-core.git", branch = "master" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "encode"
harness = false
